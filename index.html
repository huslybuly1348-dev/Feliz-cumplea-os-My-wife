<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Mooncita 💖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1a1c2e 0%, #090a10 100%);
      font-family: system-ui, -apple-system, sans-serif;
      color: #cdd6f4;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .card {
      background: rgba(15, 18, 28, 0.92);
      border: 2px solid #f38ba8; border-radius: 20px;
      padding: 30px 20px; max-width: 420px; width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(243,139,168,0.2);
    }
    h1 { color: #f38ba8; font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #a6adc8; font-size: 1rem; line-height: 1.5; margin-bottom: 25px; }
    .btn-container { display: flex; flex-direction: column; gap: 15px; }
    .btn {
      display: block; padding: 16px 20px; border-radius: 14px;
      text-decoration: none; font-weight: bold; font-size: 1.05rem;
    }
    .btn-game { background: linear-gradient(135deg, #ff79c6, #ff4d6d); color: #fff; }
    .btn-novel { background: linear-gradient(135deg, #f38ba8, #dda7a5); color: #11111b; }
  </style>
</head>
<body>

  <div class="card">
    <h1>¡Feliz Cumpleaños, Moon! 💖</h1>
    <p>Te preparé dos experiencias especiales hechas con mucho amor. Elige por cuál quieres empezar:</p>

    <div class="btn-container">
      <a class="btn btn-game" href="FELIZ CUMPLEAÑOS MA CHERIE (14).html">
        🎮 1. Aventura en la Playa
      </a>
      <a class="btn btn-novel" href="Te amo por los siglos de los huesos.html">
        📖 2. Novela Visual & Carta
      </a>
    </div>
  </div>

</body>
</html>
